interface:
  display_name: "Agent Plugin Bootstrap"
  short_description: "Create a new production-ready AI-agent plugin with one shared core and Codex, Claude Code, and OpenCode distributions. Invoke explicitly when the user wants to bootstrap, scaffold, or standardize an agent plugin repository."
